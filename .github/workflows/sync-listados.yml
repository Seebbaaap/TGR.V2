name: Sync listados Mercado Público

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync-listados:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Sync listados (licitaciones, OC, compra ágil)
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "=== Sync listados $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

          HTTP_CODE=$(curl -sS -w "%{http_code}" -o response.json \
            "${APP_URL}/api/sync/mercado-publico?secret=${CRON_SECRET}")

          echo "HTTP ${HTTP_CODE}"
          cat response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Sync listados falló (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo "=== Fin sync listados ==="
